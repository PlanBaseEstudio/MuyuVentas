<div class="container">

    <button type="button" class="btn-cant" onclick="cambiarCantidad(1)">+</button>
  </div>

  <label for="total">Total (S/):</label>
  <input type="text" id="total" readonly>

<!-- MOD-006: JAVASCRIPT [INICIO] -->
<script>
// MOD-006-001: INICIALIZACIÓN [INICIO]
const baseUrl = window.location.href.split('?')[0];
google.script.run.withSuccessHandler(cargarCategorias).getCategorias();
google.script.run.withSuccessHandler(cargarModosPago).getModosPago();
// MOD-006-001: FIN

// MOD-006-002: CARGAR DESPLEGABLES [INICIO]
function cargarCategorias(data) {
  const select = document.getElementById("categoria");
  data.forEach(cat => {
    const option = document.createElement("option");
    option.value = cat;
    option.textContent = cat;
    select.appendChild(option);
  });
}

function cargarModosPago(data) {
  const contenedor = document.getElementById("btnsModoPago");
  contenedor.innerHTML = '';
  data.forEach(mp => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn-pago";
    btn.textContent = mp;
    btn.onclick = () => seleccionarModoPago(mp, btn);
    contenedor.appendChild(btn);
  });
}
// MOD-006-002: FIN

// MOD-006-003: CALCULADORA TOTAL [INICIO]
document.getElementById("precio").addEventListener("input", calcularTotal);
document.getElementById("cantidad").addEventListener("input", calcularTotal);

function calcularTotal() {
  const precio    = parseFloat(document.getElementById("precio").value)    || 0;
  const cantidad  = parseFloat(document.getElementById("cantidad").value)  || 0;
  document.getElementById("total").value = (precio * cantidad).toFixed(2);
}
// MOD-006-003: FIN

// MOD-006-004: REGISTRAR VENTA [INICIO]
function registrarVenta() {
  if (!modoPagoSeleccionado) {
    const msg = document.getElementById("mensaje");
    msg.textContent = "⚠️ Selecciona un modo de pago.";
    msg.style.display = "block";
    msg.style.color = "red";
    setTimeout(() => msg.style.display = "none", 4000);
    return;
  }

  const data = {
    categoria: document.getElementById("categoria").value,
    producto:  document.getElementById("producto").value,
    modoPago:  modoPagoSeleccionado,
    precio:    document.getElementById("precio").value,
    cantidad:  document.getElementById("cantidad").value
  };

  const btnRegistrar = document.getElementById("btnRegistrar");
  const msg = document.getElementById("mensaje");

  btnRegistrar.disabled = true;
  btnRegistrar.textContent = "Guardando...";
  msg.textContent = "⏳ Guardando...";
  msg.style.display = "block";
  msg.style.color = "#856404";

  google.script.run
    .withSuccessHandler(function() {
      msg.textContent = "✅ Registro exitoso";
      msg.style.color = "green";
      document.getElementById("producto").value = "";
      document.getElementById("precio").value   = "";
      document.getElementById("cantidad").value = "";
      document.getElementById("total").value    = "";
      btnRegistrar.disabled = false;
      btnRegistrar.textContent = "Registrar venta";
      setTimeout(() => msg.style.display = "none", 5000);
    })
    .withFailureHandler(function(err) {
      msg.textContent = "❌ Error: " + err.message;
      msg.style.color = "red";
      btnRegistrar.disabled = false;
      btnRegistrar.textContent = "Registrar venta";
      setTimeout(() => msg.style.display = "none", 6000);
    })
    .registrarVenta(data);
}
// MOD-006-004: FIN

// MOD-006-005: VARIABLE Y SELECTOR MODO PAGO [INICIO]
let modoPagoSeleccionado = null;

function seleccionarModoPago(modo, botonClickeado) {
  document.querySelectorAll('.btn-pago').forEach(b => b.classList.remove('activo'));
  botonClickeado.classList.add('activo');
  modoPagoSeleccionado = modo;
}
// MOD-006-005: FIN

// MOD-006-006: CONTROL CANTIDAD +/- [INICIO]
function cambiarCantidad(delta) {
  const input  = document.getElementById("cantidad");
  const actual = Math.floor(parseFloat(input.value) || 0);
  const nuevo  = actual + delta;
  if (nuevo < 1) return;
  input.value = nuevo;
  calcularTotal();
}
// MOD-006-006: FIN
</script>
<!-- MOD-006: FIN -->

</body>
